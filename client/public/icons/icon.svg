<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1524"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing accent ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#6366f1" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Logo graphic: Modern Invoice/Building/Vault icon -->
  <g filter="url(#shadow)" transform="translate(116, 116)">
    <!-- Document base -->
    <rect x="20" y="20" width="240" height="240" rx="32" fill="url(#iconGrad)"/>
    
    <!-- Lines / Details -->
    <path d="M 60 70 L 220 70 M 60 115 L 180 115 M 60 160 L 220 160 M 60 205 L 140 205" 
          stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-opacity="0.9"/>
          
    <!-- Checkmark accent badge -->
    <circle cx="210" cy="210" r="48" fill="#10b981"/>
    <path d="M 190 210 L 204 224 L 230 196" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
